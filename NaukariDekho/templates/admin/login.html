{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>

Naukri Dekho Admin

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{

background:

linear-gradient(
135deg,
#eef2ff,
#f8fafc
);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

font-family:

'Segoe UI',
sans-serif;

}

.login-card{

width:100%;

max-width:420px;

background:white;

border:none;

border-radius:24px;

box-shadow:

0 15px 45px rgba(
0,
0,
0,
0.08
);

overflow:hidden;

}

.login-header{

background:

linear-gradient(
135deg,
#4f46e5,
#7c3aed
);

padding:35px;

text-align:center;

color:white;

}

.logo{

width:70px;

height:70px;

border-radius:18px;

background:

rgba(
255,
255,
255,
0.15
);

display:flex;

align-items:center;

justify-content:center;

margin:auto;

font-size:28px;

margin-bottom:15px;

backdrop-filter:

blur(8px);

}

.login-body{

padding:35px;

}

.form-control{

height:50px;

border-radius:12px;

border:

1px solid #dbe1ea;

}

.form-control:focus{

border-color:#4f46e5;

box-shadow:

0 0 0 .2rem rgba(
79,
70,
229,
0.15
);

}

.btn-login{

background:

linear-gradient(
135deg,
#4f46e5,
#7c3aed
);

border:none;

height:50px;

border-radius:12px;

font-weight:600;

transition:.25s;

}

.btn-login:hover{

transform:

translateY(-2px);

box-shadow:

0 10px 20px rgba(
79,
70,
229,
0.25
);

}

.errornote{

background:#fee2e2;

color:#dc2626;

padding:12px;

border-radius:12px;

margin-bottom:18px;

font-size:14px;

}

</style>

</head>

<body>

<div class="login-card">

<div class="login-header">

<div class="logo">

<i class="bi bi-shield-lock-fill"></i>

</div>

<h3 class="fw-bold mb-1">

Naukri Dekho

</h3>

<p class="mb-0 opacity-75">

Admin Authentication

</p>

</div>

<div class="login-body">

{% if form.errors %}

<div class="errornote">

Invalid username or password

</div>

{% endif %}

<form
method="post"
action="{{ app_path }}">

{% csrf_token %}

<div class="mb-3">

<label
class="form-label fw-semibold">

Username

</label>

{{ form.username }}

</div>

<div class="mb-4">

<label
class="form-label fw-semibold">

Password

</label>

{{ form.password }}

</div>

<input
type="hidden"
name="next"
value="{{ next }}">

<button
type="submit"
class="btn btn-login text-white w-100">

<i class="bi bi-box-arrow-in-right me-2"></i>

Secure Login

</button>

</form>

</div>

</div>

</body>

</html>
