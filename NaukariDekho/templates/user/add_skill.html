{% extends 'base.html' %}
{% block content %}

<div class="container-fluid py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-xl-5">

            <!-- TOP BAR -->

            <div
                class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                <div>

                    <h2 class="fw-bold mb-1">

                        Add Skill

                    </h2>

                    <p class="text-muted mb-0">

                        Add skills to strengthen your profile

                    </p>

                </div>

                <a
                    href="{% url 'skills' %}"
                    class="btn btn-light border rounded-pill px-4 shadow-sm">

                    <i class="bi bi-arrow-left me-2"></i>

                    Back

                </a>

            </div>

            <!-- FORM CARD -->

            <div
                class="card border-0 shadow-lg rounded-4 overflow-hidden">

                <!-- HEADER -->

                <div
                    class="text-white p-4"
                    style="background:linear-gradient(135deg,#4f46e5,#7c3aed);">

                    <div
                        class="d-flex align-items-center">

                        <div
                            class="skill-icon me-3">

                            <i
                               class="bi bi-lightning-charge-fill">
                            </i>

                        </div>

                        <div>

                            <h4
                               class="fw-bold mb-1">

                                Skill Details

                            </h4>

                            <p
                               class="mb-0 opacity-75">

                                Add professional or technical skills

                            </p>

                        </div>

                    </div>

                </div>

                <!-- FORM -->

                <div
                    class="card-body p-4 p-lg-5">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label
                                class="form-label fw-semibold">

                                Skill Name

                            </label>

                            {{ form.name }}

                        </div>

                        <!-- EXAMPLES -->

                        <div
                            class="mb-4">

                            <small
                                class="text-muted">

                                Examples:

                            </small>

                            <div
                                class="mt-2 d-flex flex-wrap gap-2">

                                <span class="skill-chip">

                                    Python

                                </span>

                                <span class="skill-chip">

                                    Java

                                </span>

                                <span class="skill-chip">

                                    Django

                                </span>

                                <span class="skill-chip">

                                    Bootstrap

                                </span>

                                <span class="skill-chip">

                                    SQL

                                </span>

                            </div>

                        </div>

                        <!-- BUTTONS -->

                        <div
                            class="d-flex gap-3 mt-4">

                            <a
                               href="{% url 'skills' %}"
                               class="btn btn-light border flex-fill py-2">

                                Cancel

                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary flex-fill py-2">

                                Save Skill

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<style>

.skill-icon{

width:60px;

height:60px;

border-radius:18px;

background:

rgba(
255,
255,
255,
0.15
);

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

backdrop-filter:

blur(
10px
);

}

.skill-chip{

padding:

8px 14px;

border-radius:

50px;

background:

#eef2ff;

color:

#4f46e5;

font-weight:

600;

font-size:

13px;

}

input,
select,
textarea{

border-radius:

14px !important;

padding:

12px 14px !important;

border:

1px solid #dee2e6 !important;

box-shadow:

none !important;

}

input:focus,
select:focus,
textarea:focus{

border-color:

#4f46e5 !important;

box-shadow:

0 0 0 .2rem
rgba(
79,
70,
229,
0.15
)

!important;

}

.card{

transition:

.3s;

}

.card:hover{

transform:

translateY(
-3px
);

}

</style>

{% endblock %}
