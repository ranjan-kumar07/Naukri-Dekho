<div class="col-lg-3 col-md-4 sidebar p-0">

    <div class="sidebar-wrapper d-flex flex-column">

        <!-- PROFILE IMAGE + UPLOAD -->

        <div class="text-center sidebar-top">

            <form
                method="POST"
                enctype="multipart/form-data"
                action="{% url 'update_profile' %}"
                id="profileImageForm"
            >

                {% csrf_token %}

                <div class="profile-img-wrapper">

                    <label for="profileUpload"
                           class="profile-img-label">

                        {% if request.user.profile.profile_image %}

                            <img
                                src="{{ request.user.profile.profile_image.url }}"
                                class="profile-img shadow"
                            >

                        {% else %}

                            <img
                                src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                                class="profile-img shadow"
                            >

                        {% endif %}

                        <!-- HOVER OVERLAY -->

                        <div class="profile-overlay">

                            <i class="bi bi-camera-fill"></i>

                            <small>Change</small>

                        </div>

                    </label>

                </div>

                <!-- Hidden File Input -->

                <input
                    type="file"
                    name="profile_image"
                    id="profileUpload"
                    hidden
                    onchange="document.getElementById('profileImageForm').submit();"
                >

            </form>

            <!-- Username -->

            <h4 class="fw-bold mt-3 text-white">

                @{{ request.user.username }}

            </h4>

            <p class="text-light small">

                Welcome Back 👋

            </p>

        </div>

        <!-- NAVIGATION -->

        <ul class="nav flex-column px-3 mt-4">

            <!-- Home -->

            <li class="nav-item mb-3">

                <a href="{% url 'user_dashboard' %}"
                   class="nav-link dashboard-link {% if request.resolver_match.url_name == 'user_dashboard' %}active{% endif %}">

                    <i class="bi bi-house-door-fill me-2"></i>

                    Home

                </a>

            </li>

            <!-- Browse Jobs -->

            <li class="nav-item mb-3">

                <a href="{% url 'all_jobs' %}"
                   class="nav-link dashboard-link {% if request.resolver_match.url_name == 'all_jobs' %}active{% endif %}">

                    <i class="bi bi-briefcase-fill me-2"></i>

                    Browse Jobs

                </a>

            </li>

            <!-- Selected Applications -->

            <li class="nav-item mb-3">

                <a href="{% url 'selected_applications' %}"
                   class="nav-link dashboard-link {% if request.resolver_match.url_name == 'selected_applications' %}active{% endif %}">

                    <i class="bi bi-file-earmark-check-fill me-2"></i>

                    Selected Applications

                </a>

            </li>

            <!-- Profile -->

            <li class="nav-item mb-3">

                <a href="{% url 'profile' %}"
                   class="nav-link dashboard-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">

                    <i class="bi bi-person-fill me-2"></i>

                    Profile

                </a>

            </li>

        </ul>

        <!-- LOGOUT -->

        <div class="p-3 mt-auto">

            <a href="{% url 'logout' %}"
               class="btn btn-logout-custom w-100 rounded-pill py-2-5">

                <i class="bi bi-box-arrow-left me-2"></i>

                Logout

            </a>

        </div>

    </div>

</div>
